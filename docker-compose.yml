services:
  certs-gen:
      image: alpine:latest
      container_name: certs_generator
      volumes:
        - ./certs:/scripts 
        - certs_data:/out  
      command: >
        sh -c "apk add --no-cache openssl && 
               cd /scripts && 
               chmod +x gen.sh && 
               ./gen.sh && 
               cp *.pem /out/ 2>/dev/null || cp *.crt /out/ 2>/dev/null || cp *.key /out/ 2>/dev/null"
      networks:
        - app-network
  # ── Profile ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    hostname: postgres
    environment:
      POSTGRES_DB: ${PROFILE_DB_NAME}
      POSTGRES_USER: ${PROFILE_DB_USER}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  migrate:
    image: migrate/migrate
    container_name: migrate-service
    volumes:
      - ./Profile/migrations:/migrations
    command: -path=/migrations/ -database "postgres://${PROFILE_DB_USER}:${PROFILE_DB_PASSWORD}@postgres:5432/${PROFILE_DB_NAME}?sslmode=disable" up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  app:
    image: ghcr.io/sewaustav/casego-profile:latest
    platform: linux/amd64
    build:
      context: ./Profile
      args:
        SERVICE_NAME: caseGo
    container_name: app-service
    env_file: Profile/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./certs:/root/certs:ro
    ports:
      - "8080:8080"
      - "50053:50053"
    depends_on:
      certs-gen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  # ── Auth ─────────────────────────────────────────────────
  auth-fastapi:
    image: ghcr.io/sewaustav/casego-auth:latest
    platform: linux/amd64
    build:
      context: ./Auth
    container_name: auth_fastapi
    ports:
      - "${API_PORT_FORWARD:-8000}:${API_PORT:-8000}"
    env_file:
      - Auth/.env
    volumes:
      - ./Auth/keys:/app/keys:ro
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=2)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    networks:
      - app-network

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    restart: unless-stopped
    env_file:
      - Auth/.env
    ports:
      - "5444:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  auth-migrate:
    image: ghcr.io/sewaustav/casego-auth:latest
    platform: linux/amd64
    build:
      context: ./Auth
    container_name: auth_migrate
    command: alembic upgrade head
    env_file:
      - Auth/.env
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - app-network

  # ── CaseGo ───────────────────────────────────────────────
  casego-postgres:
    image: postgres:15-alpine
    container_name: casego_postgres
    restart: unless-stopped
    env_file:
      - CaseGo/.env
    ports:
      - "5433:5432"
    volumes:
      - casego_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  casego-migrate:
    image: migrate/migrate
    container_name: casego_migrate
    volumes:
      - ./CaseGo/migrations:/migrations
    command: -path=/migrations/ -database "postgres://${CASEGO_DB_USER}:${CASEGO_DB_PASSWORD}@casego-postgres:5432/${CASEGO_DB_NAME}?sslmode=disable" up
    depends_on:
      casego-postgres:
        condition: service_healthy
    networks:
      - app-network

  casego-redis:
    image: redis:8-alpine
    container_name: casego_redis
    command: redis-server --requirepass ${CASEGO_REDIS_PASSWORD}
    restart: unless-stopped
    ports:
      - "6380:6379"
    env_file:
      - CaseGo/.env
    volumes:
      - casego_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  case-go:
    image: ghcr.io/sewaustav/casego-casego:latest
    platform: linux/amd64
    build:
      context: ./CaseGo
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: case_go
    env_file:
      - CaseGo/.env
    environment:
      POSTGRES_HOST: casego-postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: casego-redis
      REDIS_PORT: 6379
      PAYMENT_GRPC_SERVER: payment-service:50052
    volumes:
      - ./certs/ca.crt:/app/ca.crt:ro
      - ./certs/general-client.crt:/app/general-client.crt:ro
      - ./certs/general-client.key:/app/general-client.key:ro
    ports:
      - "8081:8081"
    depends_on:
      certs-gen:
        condition: service_completed_successfully
      casego-postgres:
        condition: service_healthy
      casego-migrate:
        condition: service_completed_successfully
      casego-redis:
        condition: service_healthy
      payment-service:
        condition: service_started
    networks:
      - app-network

  # ── CaseProfile ──────────────────────────────────────────
  caseprofile-postgres:
    image: postgres:15-alpine
    container_name: caseprofile_postgres
    restart: unless-stopped
    env_file:
      - CaseProfile/.env
    ports:
      - "5434:5432"
    volumes:
      - caseprofile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  caseprofile-migrate:
    image: migrate/migrate
    container_name: caseprofile_migrate
    volumes:
      - ./CaseProfile/migrations:/migrations
    command: -path=/migrations/ -database "postgres://${CASEPROFILE_DB_USER}:${CASEPROFILE_DB_PASSWORD}@caseprofile-postgres:5432/${CASEPROFILE_DB_NAME}?sslmode=disable" up
    depends_on:
      caseprofile-postgres:
        condition: service_healthy
    networks:
      - app-network

  case-profile:
    image: ghcr.io/sewaustav/casego-caseprofile:latest
    platform: linux/amd64
    build:
      context: ./CaseProfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: case_profile
    env_file:
      - CaseProfile/.env
    environment:
      POSTGRES_HOST: caseprofile-postgres
      POSTGRES_PORT: 5432
    ports:
      - "8082:8082"
      - "50051:50051"
    volumes:
      - certs_data:/app/certs:ro
    depends_on:
      certs-gen:
        condition: service_completed_successfully
      caseprofile-postgres:
        condition: service_healthy
      caseprofile-migrate:
        condition: service_completed_successfully
    networks:
      - app-network
# ── Payment ──────────────────────────────────────────────
  payment-postgres:
    image: postgres:15-alpine
    container_name: payment_postgres
    restart: unless-stopped
    env_file:
      - Payment/.env
    ports:
      - "5436:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  payment-migrate:
    image: migrate/migrate
    container_name: payment_migrate
    volumes:
      - ./Payment/migrations:/migrations
    command: -path=/migrations/ -database "postgres://${PAYMENT_DB_USER}:${PAYMENT_DB_PASSWORD}@payment-postgres:5432/${PAYMENT_DB_NAME}?sslmode=disable" up
    depends_on:
      payment-postgres:
        condition: service_healthy
    networks:
      - app-network

  payment-service:
    image: ghcr.io/sewaustav/casego-payment:latest
    platform: linux/amd64
    build:
      context: ./Payment
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: payment_service
    env_file:
      - Payment/.env
    environment:
      POSTGRES_HOST: payment-postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "8085:8085"
      - "50052:50052"
    depends_on:
      payment-postgres:
        condition: service_healthy
      payment-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

volumes:
  auth_postgres_data:
  casego_postgres_data:
  casego_redis_data:
  caseprofile_postgres_data:
  payment_postgres_data:
  certs_data:

networks:
  app-network:
    driver: bridge
