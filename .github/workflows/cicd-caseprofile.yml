name: CI/CD - CaseProfile (Go)

on:
  push:
    branches: [main, dev, 'feature/**', 'feat/**']
    paths:
      - 'CaseProfile/**'
      - '.github/workflows/cicd-caseprofile.yml'
  pull_request:
    branches: [main, dev, 'feature/**', 'feat/**']
    paths:
      - 'CaseProfile/**'
      - '.github/workflows/cicd-caseprofile.yml'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CaseProfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: CaseProfile/go.mod
          cache-dependency-path: CaseProfile/go.sum

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/casego-caseprofile
          if [ "${{ github.ref_name }}" = "main" ]; then
            # prod: main-теги подхватывает Flux image automation в k8s
            echo "tags=$IMAGE:main-${{ github.run_number }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # dev: :latest тянет docker compose на VPS
            echo "tags=$IMAGE:latest,$IMAGE:dev-${{ github.run_number }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./CaseProfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: GITHUB_TOKEN=${{ secrets.GH_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy CaseProfile (dev VPS)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          AUTH_PUBLIC_KEY: ${{ secrets.AUTH_PUBLIC_KEY }}
          CASEGO_PUBLIC_KEY: ${{ secrets.CASEGO_PUBLIC_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: maks
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AUTH_PUBLIC_KEY,CASEGO_PUBLIC_KEY
          script: |
            cd ~/casego/backend
            git fetch origin dev && git checkout -B dev origin/dev
            python3 -c 'import os;p="/home/maks/casego/backend/CaseProfile/.env";e1=os.environ["AUTH_PUBLIC_KEY"].strip().replace(chr(10),r"\n");e2=os.environ["CASEGO_PUBLIC_KEY"].strip().replace(chr(10),r"\n");base=open(p).read();lines=[l for l in base.splitlines() if not any(l.startswith(k) for k in ["AUTH_PUBLIC_KEY=","CASEGO_PUBLIC_KEY=","PUBLIC_KEY="]) and l.strip()!=""];lines+=["AUTH_PUBLIC_KEY=\""+e1+"\"","CASEGO_PUBLIC_KEY=\""+e2+"\""];open(p,"w").write("\n".join(lines)+"\n");print("Updated",p)'
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull case-profile
            docker compose up -d --no-deps case-profile
