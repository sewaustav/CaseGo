name: CI - CaseProfile (Go)

on:
  push:
    branches: [main, develop, 'feature/**', 'feat/**']
    paths:
      - 'CaseProfile/**'
      - '.github/workflows/ci-caseprofile.yml'
  pull_request:
    branches: [main, develop, 'feature/**', 'feat/**']
    paths:
      - 'CaseProfile/**'
      - '.github/workflows/ci-caseprofile.yml'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CaseProfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: CaseProfile/go.mod
          cache-dependency-path: CaseProfile/go.sum

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./CaseProfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/casego-caseprofile:latest
            ghcr.io/${{ github.repository_owner }}/casego-caseprofile:main-${{ github.sha }}
          build-args: GITHUB_TOKEN=${{ secrets.GH_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy CaseProfile
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          AUTH_PUBLIC_KEY: ${{ secrets.AUTH_PUBLIC_KEY }}
          CASEGO_PUBLIC_KEY: ${{ secrets.CASEGO_PUBLIC_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: maks
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AUTH_PUBLIC_KEY,CASEGO_PUBLIC_KEY
          script: |
            cd ~/casego/backend
            git fetch origin && git reset --hard origin/main
            python3 -c 'import re,os;p="/home/maks/casego/backend/CaseProfile/.env";c=open(p).read();c=re.sub(r"(?m)^PUBLIC_KEY=[^\n]*\n?","",c);e1=os.environ["AUTH_PUBLIC_KEY"].strip().replace(chr(10),r"\n");l1="AUTH_PUBLIC_KEY=\""+e1+"\"";p1=r"AUTH_PUBLIC_KEY=(\x22[^\x22]*\x22|[^\n]*)";c=re.sub(p1,lambda m:l1,c,flags=re.DOTALL) if re.search(p1,c) else c+"\n"+l1;e2=os.environ["CASEGO_PUBLIC_KEY"].strip().replace(chr(10),r"\n");l2="CASEGO_PUBLIC_KEY=\""+e2+"\"";p2=r"CASEGO_PUBLIC_KEY=(\x22[^\x22]*\x22|[^\n]*)";c=re.sub(p2,lambda m:l2,c,flags=re.DOTALL) if re.search(p2,c) else c+"\n"+l2;open(p,"w").write(c);print("Updated",p)'
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull case-profile
            docker compose up -d --no-deps case-profile
