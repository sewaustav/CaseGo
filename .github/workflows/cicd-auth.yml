name: CI/CD - Auth (Python)

on:
  push:
    branches: [main, dev, 'feature/**', 'feat/**']
    paths:
      - 'Auth/**'
      - '.github/workflows/cicd-auth.yml'
  pull_request:
    branches: [main, dev, 'feature/**', 'feat/**']
    paths:
      - 'Auth/**'
      - '.github/workflows/cicd-auth.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # тесты/линт — гейт на PR и на push в dev; на push в main пропускаем (PR уже проверил)
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'

    defaults:
      run:
        working-directory: Auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Auth/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Auth

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      REDIS_DB: 0
      CORS_ORIGINS: http://localhost
      JWT_ALG: RS256
      GOOGLE_CLIENT_ID: test-google-client-id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Auth/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Generate RSA keys
        run: cd keys && python generate_rsa_keys.py

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest src/ -v

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: >-
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/casego-auth
          # монотонная метка: github.run_number сбрасывается при переименовании
          # workflow, из-за чего numerical ImagePolicy залипает на старом теге
          SEQ=$(date +%s)
          if [ "${{ github.ref_name }}" = "main" ]; then
            # prod: main-теги подхватывает Flux image automation в k8s
            echo "tags=$IMAGE:main-$SEQ-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # dev: :latest тянет docker compose на VPS
            echo "tags=$IMAGE:latest,$IMAGE:dev-$SEQ-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Auth
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Auth (dev VPS)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: maks
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/casego/backend
            mkdir -p Auth/keys
            [ -f Auth/keys/private.pem ] || echo "${{ secrets.AUTH_PRIVATE_KEY }}" > Auth/keys/private.pem
            [ -f Auth/keys/public.pem ] || echo "${{ secrets.AUTH_PUBLIC_KEY }}" > Auth/keys/public.pem
            chmod 644 Auth/keys/private.pem Auth/keys/public.pem
            git fetch origin dev && git checkout -B dev origin/dev
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull auth-fastapi auth-migrate
            docker compose up -d --no-deps auth-migrate
            docker compose up -d --no-deps auth-fastapi
